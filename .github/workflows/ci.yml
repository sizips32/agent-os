name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/native/office-reader/target
          key: cargo-${{ hashFiles('apps/desktop/native/office-reader/Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same version the Python files were formatted with; the formatter changes between releases.
      - run: pip install ruff==0.3.4
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coordination
      - run: npm run test:services
      - run: cargo test --locked --manifest-path apps/desktop/native/office-reader/Cargo.toml
      - run: npm run build
      # Launches the built app against the offline fixture transport; needs the macOS window server.
      # Fixture mode launches ~/.local/bin/node (a link to the Hermes node on a real machine).
      - run: mkdir -p ~/.local/bin && ln -sf "$(command -v node)" ~/.local/bin/node
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file apps/desktop/native/office-reader/Cargo.lock
